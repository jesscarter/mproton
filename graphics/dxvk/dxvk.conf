# dxvk.conf for DXVK v3.1.1 on KosmicKrisp (Mesa's Vulkan-on-Metal driver, Apple M1-M3).
#
# NO SETTING IS ACTIVE. The audit (docs/graphics-dxvk.md) found that DXVK 3.1.1 already does
# the right thing on KosmicKrisp with its defaults:
#   - it falls back to its descriptor-set path, since KosmicKrisp has neither
#     VK_EXT_descriptor_heap nor VK_EXT_descriptor_buffer (and DXVK enables those only on
#     drivers it allowlists, which do not include KosmicKrisp);
#   - it compiles full pipelines, since there is no VK_EXT_graphics_pipeline_library;
#   - it turns tiler mode on by itself for VK_DRIVER_ID_MESA_KOSMICKRISP;
#   - it hides fp64 from D3D11 and rejects fp64 shaders cleanly, since shaderFloat64 is false.
# The options below are the candidates the audit considered. Each is a per-game tuning knob,
# to be turned on only after an mpbench or game measurement on a Mac shows it helps. Copy a
# line into a game's dxvk.conf (DXVK_CONFIG_FILE=/path/to/dxvk.conf) and uncomment it.

# --- Tiler mode -----------------------------------------------------------------------------
# Apple GPUs are tile-based. With tilerMode DXVK keeps render passes intact (preferRenderPassOps)
# and prefers cached memory for CPU-visible allocations. DXVK 3.1.1 sets it automatically for
# KosmicKrisp's driver ID (src/dxvk/dxvk_device.cpp, getPerfHints). Force it only if a future
# KosmicKrisp build reports a different driver ID, or set False to measure the difference.
# dxvk.tilerMode = True

# --- Tessellation ---------------------------------------------------------------------------
# Metal's tessellation model differs from Vulkan's (no hull-shader stage; factors come from a
# compute pass), so KosmicKrisp has to translate it, at a cost nobody has measured yet. It
# reports maxTessellationGenerationLevel = 64 (the D3D11 maximum), so DXVK does not clamp. For
# a game whose tessellation is slow, a lower cap trades geometric detail for speed.
# d3d11.maxTessFactor = 16

# --- Vendor ID ------------------------------------------------------------------------------
# DXGI reports the real adapter: vendor 0x106b (Apple), "Apple M2". Most games accept an
# unknown vendor; a few refuse to start or choose broken code paths. For those, report AMD
# (hex PCI ID 1002). Off by default: it also switches on AMD-specific paths in some games.
# dxgi.customVendorId = 1002

# --- Memory reporting -----------------------------------------------------------------------
# KosmicKrisp exposes a single DEVICE_LOCAL | HOST_VISIBLE heap (unified memory; 11.84 GiB in
# results/m0-kosmickrisp-m2-vulkaninfo.txt). With one heap DXGI reports all of it as dedicated
# video memory and the same again as shared (src/dxgi/dxgi_adapter.cpp). Games that size
# texture streaming from that number may oversubscribe RAM. Cap it (MiB) per game.
# dxgi.maxDeviceMemory = 6144

# --- Options that do nothing on KosmicKrisp (kept here so nobody tries them) ------------------
# dxvk.enableGraphicsPipelineLibrary  needs VK_EXT_graphics_pipeline_library (absent)
# dxvk.enableDescriptorBuffer         needs VK_EXT_descriptor_buffer (absent)
# dxvk.enableDescriptorHeap           needs VK_EXT_descriptor_heap (absent)
# dxvk.trackPipelineLifetime          only acts when graphics pipeline libraries are in use
